<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wireframe — Site BUT MMI</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      background-color: #f4f4f5;
      color: #18181b;
      padding: 28px 20px;
    }

    .wf-wrap {
      max-width: 880px;
      margin: 0 auto;
    }

    .wf-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 18px;
    }

    .wf-top h1 {
      font-size: 1rem;
    }

    .wf-btn-back {
      padding: 7px 12px;
      border: 1.5px solid #18181b;
      background-color: #18181b;
      color: #ffffff;
      text-decoration: none;
      font-size: 0.8rem;
    }

    .wf-canvas {
      background-color: #ffffff;
      border: 2px solid #18181b;
      padding: 18px;
      display: grid;
      gap: 16px;
    }

    .wf-zone {
      border: 1.5px dashed #71717a;
      padding: 14px;
      background-color: #fafafa;
    }

    .wf-tag {
      display: inline-block;
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
      background-color: #18181b;
      color: #ffffff;
      padding: 2px 7px;
      margin-bottom: 12px;
    }

    .bar {
      height: 10px;
      background-color: #d4d4d8;
    }

    .bar-lg {
      height: 20px;
      background-color: #a1a1aa;
      width: 65%;
    }

    .bar-sm {
      width: 45%;
    }

    .stack {
      display: grid;
      gap: 8px;
    }

    .box {
      border: 1.5px solid #52525b;
      background-color: #f4f4f5;
      padding: 7px 12px;
      font-size: 0.75rem;
      text-align: center;
    }

    .row-between {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }

    .nav-links {
      display: flex;
      gap: 6px;
    }

    .nav-links span {
      width: 44px;
      height: 10px;
      background-color: #d4d4d8;
      display: inline-block;
    }

    .grid-2 {
      display: grid;
      grid-template-columns: 1.2fr 0.8fr;
      gap: 16px;
    }

    .grid-3 {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
    }

    .grid-4 {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
    }

    .card {
      border: 1.5px solid #71717a;
      background-color: #ffffff;
      padding: 12px;
      display: grid;
      gap: 8px;
    }

    .dl-row {
      border-bottom: 1px solid #a1a1aa;
      padding: 6px 0;
      display: flex;
      justify-content: space-between;
    }

    .dl-row span {
      height: 8px;
      width: 35%;
      background-color: #d4d4d8;
    }

    .acc-row {
      border: 1.5px solid #71717a;
      background-color: #ffffff;
      padding: 9px 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    @media (max-width: 680px) {
      .grid-2,
      .grid-3,
      .grid-4 {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="wf-wrap">
    <div class="wf-top">
      <h1>WIREFRAME — BUT MMI</h1>
      <a href="index.html" class="wf-btn-back">← Retour au site</a>
    </div>

    <div class="wf-canvas">
      <div class="wf-zone">
        <span class="wf-tag">01. Header sticky</span>
        <div class="row-between">
          <div class="box">TITRE</div>
          <div class="nav-links">
            <span></span><span></span><span></span><span></span><span></span>
          </div>
        </div>
      </div>

      <div class="wf-zone">
        <span class="wf-tag">02. Hero (1 colonne)</span>
        <div class="stack">
          <div class="bar bar-sm"></div>
          <div class="bar-lg"></div>
          <div class="bar"></div>
          <div class="row-between" style="justify-content: flex-start; margin-top: 6px;">
            <div class="box">Bouton</div>
            <div class="box">Lien</div>
          </div>
        </div>
      </div>

      <div class="wf-zone">
        <span class="wf-tag">03. Formation (2 colonnes : texte + chiffres)</span>
        <div class="grid-2">
          <div class="stack">
            <div class="bar"></div>
            <div class="bar"></div>
            <div class="bar bar-sm"></div>
          </div>
          <div class="card">
            <div class="dl-row"><span></span><span></span></div>
            <div class="dl-row"><span></span><span></span></div>
            <div class="dl-row"><span></span><span></span></div>
          </div>
        </div>
      </div>

      <div class="wf-zone">
        <span class="wf-tag">04. Parcours (3 colonnes)</span>
        <div class="grid-3">
          <div class="card"><div class="bar bar-sm"></div><div class="bar"></div></div>
          <div class="card"><div class="bar bar-sm"></div><div class="bar"></div></div>
          <div class="card"><div class="bar bar-sm"></div><div class="bar"></div></div>
        </div>
      </div>

      <div class="wf-zone">
        <span class="wf-tag">05. Débouchés (scroll horizontal)</span>
        <div class="grid-4">
          <div class="card"><div class="bar"></div></div>
          <div class="card"><div class="bar"></div></div>
          <div class="card"><div class="bar"></div></div>
          <div class="card"><div class="bar"></div></div>
        </div>
      </div>

      <div class="wf-zone">
        <span class="wf-tag">06. Programme (accordéon)</span>
        <div class="stack">
          <div class="acc-row"><div class="bar bar-sm"></div><span>+</span></div>
          <div class="acc-row"><div class="bar bar-sm"></div><span>+</span></div>
          <div class="acc-row"><div class="bar bar-sm"></div><span>+</span></div>
        </div>
      </div>

      <div class="wf-zone">
        <span class="wf-tag">07. Footer</span>
        <div class="row-between">
          <div class="bar" style="width: 160px;"></div>
          <div class="bar" style="width: 100px;"></div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
